<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#F0562B" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#F0562B" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#0B0F1A"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect y="628" width="1280" height="12" fill="#F0562B"/>

  <!-- left: title -->
  <g transform="translate(96 0)">
    <!-- dumbbell -->
    <g transform="translate(0 112)">
      <rect x="0" y="22" width="10" height="28" rx="4" fill="#FFFFFF"/>
      <rect x="13" y="12" width="14" height="48" rx="3" fill="#FFFFFF"/>
      <rect x="30" y="0" width="20" height="72" rx="3" fill="#FFFFFF"/>
      <rect x="54" y="28" width="52" height="16" rx="2" fill="#F0562B"/>
      <rect x="110" y="0" width="20" height="72" rx="3" fill="#FFFFFF"/>
      <rect x="133" y="12" width="14" height="48" rx="3" fill="#FFFFFF"/>
      <rect x="150" y="22" width="10" height="28" rx="4" fill="#FFFFFF"/>
    </g>
    <text x="0" y="276" font-size="92" font-weight="800" letter-spacing="-2"><tspan fill="#EDF0F5">Fit</tspan><tspan fill="#F0562B">Hub</tspan></text>
    <text x="4" y="326" fill="#EDF0F5" font-size="32" font-weight="600">From the front desk to the front door.</text>
    <text x="4" y="380" fill="#8A93A6" font-size="22" font-family="Consolas, 'Cascadia Mono', monospace">
      <tspan x="4" dy="0">Staff dashboard · member app · door controller.</tspan>
      <tspan x="4" dy="32">Many gyms on one platform.</tspan>
    </text>
    <g font-size="18" font-weight="600" fill="#EDF0F5">
      <rect x="4" y="462" width="104" height="38" rx="19" fill="#1A2333"/>
      <text x="56" y="487" text-anchor="middle">Laravel</text>
      <rect x="120" y="462" width="112" height="38" rx="19" fill="#1A2333"/>
      <text x="176" y="487" text-anchor="middle">Livewire</text>
      <rect x="244" y="462" width="102" height="38" rx="19" fill="#1A2333"/>
      <text x="295" y="487" text-anchor="middle">Flutter</text>
      <rect x="358" y="462" width="92" height="38" rx="19" fill="#1A2333"/>
      <text x="404" y="487" text-anchor="middle">ESP32</text>
    </g>
  </g>

  <!-- dashboard card (back) -->
  <g transform="translate(670 84)" filter="url(#shadow)">
    <rect width="300" height="200" rx="16" fill="#1A2333"/>
    <circle cx="20" cy="20" r="5" fill="#FF4D5E"/>
    <circle cx="36" cy="20" r="5" fill="#F0B429"/>
    <circle cx="52" cy="20" r="5" fill="#39D97A"/>
    <text x="20" y="58" fill="#8A93A6" font-size="12" font-weight="700" letter-spacing="1">TODAY</text>
    <g font-size="12" fill="#8A93A6">
      <rect x="20" y="72" width="100" height="62" rx="10" fill="#131A28"/>
      <text x="32" y="94">Check-ins</text>
      <text x="32" y="122" fill="#EDF0F5" font-size="24" font-weight="800">128</text>
      <rect x="130" y="72" width="100" height="62" rx="10" fill="#131A28"/>
      <text x="142" y="94">Active members</text>
      <text x="142" y="122" fill="#EDF0F5" font-size="24" font-weight="800">412</text>
    </g>
    <!-- bars -->
    <g fill="#F0562B">
      <rect x="20" y="168" width="18" height="16" rx="3" opacity="0.5"/>
      <rect x="44" y="160" width="18" height="24" rx="3" opacity="0.6"/>
      <rect x="68" y="150" width="18" height="34" rx="3" opacity="0.7"/>
      <rect x="92" y="156" width="18" height="28" rx="3" opacity="0.6"/>
      <rect x="116" y="146" width="18" height="38" rx="3" opacity="0.85"/>
      <rect x="140" y="152" width="18" height="32" rx="3" opacity="0.7"/>
      <rect x="164" y="142" width="18" height="42" rx="3"/>
    </g>
    <text x="280" y="24" text-anchor="end" fill="#8A93A6" font-size="11">Staff dashboard</text>
  </g>

  <!-- member phone (front) -->
  <g transform="translate(860 196)" filter="url(#shadow)">
    <rect width="190" height="380" rx="26" fill="#05070D"/>
    <rect x="8" y="8" width="174" height="364" rx="20" fill="#131A28"/>
    <text x="24" y="44" fill="#8A93A6" font-size="11">Gold plan · active</text>
    <text x="24" y="66" fill="#EDF0F5" font-size="17" font-weight="700">Hi, Ali</text>
    <!-- QR -->
    <rect x="35" y="84" width="120" height="120" rx="10" fill="#FFFFFF"/>
    <g fill="#0B0F1A">
      <rect x="45" y="94" width="30" height="30"/><rect x="51" y="100" width="18" height="18" fill="#FFFFFF"/><rect x="55" y="104" width="10" height="10"/>
      <rect x="115" y="94" width="30" height="30"/><rect x="121" y="100" width="18" height="18" fill="#FFFFFF"/><rect x="125" y="104" width="10" height="10"/>
      <rect x="45" y="164" width="30" height="30"/><rect x="51" y="170" width="18" height="18" fill="#FFFFFF"/><rect x="55" y="174" width="10" height="10"/>
      <rect x="83" y="96" width="8" height="8"/><rect x="95" y="104" width="8" height="8"/><rect x="83" y="116" width="8" height="8"/>
      <rect x="83" y="132" width="8" height="8"/><rect x="99" y="132" width="8" height="8"/><rect x="115" y="132" width="8" height="8"/><rect x="131" y="140" width="8" height="8"/>
      <rect x="47" y="136" width="8" height="8"/><rect x="63" y="144" width="8" height="8"/>
      <rect x="87" y="152" width="8" height="8"/><rect x="103" y="164" width="8" height="8"/><rect x="119" y="156" width="8" height="8"/>
      <rect x="135" y="172" width="8" height="8"/><rect x="87" y="180" width="8" height="8"/><rect x="115" y="184" width="8" height="8"/>
    </g>
    <text x="95" y="226" text-anchor="middle" fill="#8A93A6" font-size="11">Scan at the desk</text>
    <!-- class -->
    <rect x="20" y="240" width="150" height="46" rx="10" fill="#1A2333"/>
    <text x="32" y="259" fill="#EDF0F5" font-size="12" font-weight="700">HIIT · 6:00 pm</text>
    <text x="32" y="276" fill="#39D97A" font-size="11">Booked</text>
    <!-- unlock button -->
    <rect x="20" y="300" width="150" height="50" rx="25" fill="#F0562B"/>
    <rect x="62" y="322" width="16" height="13" rx="2" fill="#FFFFFF"/>
    <path d="M65 322 v-4 a5 5 0 0 1 10 0" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" transform="rotate(-18 75 318)"/>
    <text x="86" y="332" fill="#FFFFFF" font-size="15" font-weight="700">Unlock</text>
  </g>

  <!-- arrow phone -> door -->
  <g stroke="#F0562B" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1056 470 C 1080 470, 1086 440, 1096 420" stroke-dasharray="2 8"/>
    <path d="M1086 424 l11 -6 l2 12"/>
  </g>

  <!-- door controller -->
  <g transform="translate(1080 290)" filter="url(#shadow)">
    <rect width="160" height="120" rx="16" fill="#1A2333"/>
    <!-- board -->
    <rect x="18" y="20" width="56" height="36" rx="4" fill="#0F1420" stroke="#4B5568"/>
    <rect x="30" y="28" width="32" height="20" rx="2" fill="#4B5568"/>
    <g fill="#8A93A6"><rect x="22" y="56" width="3" height="6"/><rect x="30" y="56" width="3" height="6"/><rect x="38" y="56" width="3" height="6"/><rect x="46" y="56" width="3" height="6"/><rect x="54" y="56" width="3" height="6"/><rect x="62" y="56" width="3" height="6"/></g>
    <text x="84" y="36" fill="#EDF0F5" font-size="13" font-weight="700">ESP32</text>
    <text x="84" y="52" fill="#8A93A6" font-size="11">Front door</text>
    <rect x="18" y="76" width="124" height="28" rx="14" fill="#39D97A" fill-opacity="0.15"/>
    <circle cx="34" cy="90" r="5" fill="#39D97A"/>
    <text x="46" y="95" fill="#39D97A" font-size="13" font-weight="700">Door opened</text>
  </g>
</svg>
